    procedures:
      - id: WI-0034-50000000_VAL-COMPLETE-COMMAND-MATRIX
        sequence: 1
        name: validate-complete-command-matrix
        description: Validate build, tests, root help, every command-specific help path,
          representative dispatch, module conformance, installed CLI resolution,
          and WI-0034 validation.
        reason: Prove that every dynamically resolved command contributes help and
          dispatches through the same yargs registry.
        targetRefs:
          - "#target/WI-0034-50000000_TARGET-REPOSITORY-001"
          - "#target/WI-0034-50000000_TARGET-WORK-ITEM-001"
        objectiveRefs: []
        testCaseRefs:
          - "#test-case/TC-ROOT-HELP"
          - "#test-case/TC-COMMAND-HELP-MATRIX"
          - "#test-case/TC-COMPLETE-DISPATCH"
          - "#test-case/TC-PATTERN-CONFORMANCE"
          - "#test-case/TC-INSTALLED-CLI"
          - "#test-case/TC-WORK-ITEM"
        method:
          executionMode: executable
          target: compiled and installed sdlc CLI command registry
          steps:
            - Run yarn typecheck.
            - Run yarn build.
            - Run HOME=$(mktemp -d) yarn test --run.
            - Run sdlc -h, sdlc --help, sdlc -v, and sdlc --version.
            - Run command-specific help for work-item list, work-item validate,
              work-item start, repository info, task list, task validate, task
              next, ref validate, ref resolve, ref migrate-task-local-up, ref
              migrate-work-item-up, and stat.
            - Verify all twelve commands appear in root help and every
              command-specific help invocation exits zero.
            - Verify duplicate or malformed command modules fail closed and that
              command-specific functions remain in command files rather than
              main.ts.
            - Run command dispatch smoke tests for every command family without
              provider or deployment access.
            - Run command -v sdlc, readlink -f $(command -v sdlc), sdlc -v, and
              sdlc work-item validate --work-item WI-0034 --json.
          command: yarn typecheck && yarn build && HOME=$(mktemp -d) yarn test --run &&
            sdlc -h && sdlc work-item validate --help && sdlc task validate
            --help && sdlc work-item validate --work-item WI-0034 --json
        expected:
          outcome: passed
          exitCode: 0
          assertions:
            - The twelve-command registry is discovered and registered without
              duplicate or malformed descriptors.
            - Root and command-specific help are generated from the same yargs
              registry.
            - Command-specific functions are encapsulated in command files and
              main.ts is composition-only.
            - Build, complete tests, installed CLI, and WI-0034 validation pass.
        evidenceTier: cli-audit
        required: true
    nonGoals:
      - Do not conflate envelope processingStatus, task lifecycle status, and
        result status.
      - Do not infer approval, production readiness, or successful target
