    steps:
      - Migrate all persisted task envelopes and examples to type-specific task
        statuses, add dynamic metadata/documentation coverage, and test every
        task type and representative status/result combination.
      - Preserve ordinary JSON Schema validation while interpreting documented
        x-sdlc-* lifecycle metadata generically.
      - Run focused tests and the complete repository validation gates.
