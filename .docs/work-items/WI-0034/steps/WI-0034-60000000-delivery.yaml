task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Release the breaking type-specific task lifecycle schema change as a
      pre-1.0 minor version.
    deliveryTypes:
      - package
      - release
    inputs:
      - id: WI-0034-60000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0034-50000000#result/R-001
        purpose: Confirm the complete command/help/dispatch validation passed.
        required: true
      - id: WI-0034-60000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: "#repository-state/HEAD"
        purpose: Identify the primary branch release revision.
        required: true
    artifacts:
      - id: WI-0034-60000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the sole tracked package version
          source.
        required: true
      - id: WI-0034-60000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/<computed-next-version>
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0034-60000000_PROC-COMPUTE-REVISION
        sequence: 1
        name: compute-revision-release
        description: Derive the next revision from the highest reachable annotated
          SemVer tag and WI-0034 version impact.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0034 validation passed and its versionSuggestion impact
            is revision.
          - Update only the existing package.json version source.
          - Build and verify sdlc -v reports the computed version.
        command: git tag --merged HEAD --list && sdlc -v
        expected:
          result: The computed revision is recorded in package.json and the
            installed/compiled CLI reports the same version.
        required: true
      - id: WI-0034-60000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip
          and push when a remote exists.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Push main and the tag when the configured remote accepts the update.
        command: git tag --annotate <computed-next-version> -m 'Release
          <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; remote
            publication is recorded only when configured and successful.
        required: true
    nonGoals:
      - Do not conflate envelope processingStatus, task lifecycle status, and
        result status.
      - Do not infer approval, production readiness, or successful target
        behavior from task.status alone.
  result:
    status: delivered
    summary: 'Prepared the 0.9.0 pre-1.0 minor release on main after the WI-0034 context branch was merged and all lifecycle schema, validator, migration, documentation, test, audit, and validation gates passed.'
    artifacts:
      - id: WI-0034-60000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:fe6e2599859f870b0a175851a6f199ffb89daa92b5b4229109ff976610f7b3cc
    executions:
      - id: WI-0034-60000000_EXEC-COMPUTE-REVISION
        procedureRef: '#procedure/WI-0034-60000000_PROC-COMPUTE-REVISION'
        result:
          status: passed
          summary: 'Baseline 0.8.0 plus WI-0034 minor impact computed 0.9.0; package.json is the sole package version source and the compiled CLI reports 0.9.0.'
        command: 'git tag --merged HEAD --list && yarn typecheck && yarn build && node ./bin/cli.js --version'
      - id: WI-0034-60000000_EXEC-TAG-PRIMARY
        procedureRef: '#procedure/WI-0034-60000000_PROC-TAG-PRIMARY'
        result:
          status: passed
          summary: 'Annotated tag 0.9.0 was created at the final main release tip; remote publication was not attempted.'
        command: "git tag --annotate 0.9.0 -m 'Release 0.9.0' HEAD"
    limitations:
      - The annotated 0.9.0 tag is local-only and remote publication was not attempted; no package registry publication, deployment, or production readiness was established.
