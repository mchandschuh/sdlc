        testCaseRefs: ['#test-case/TC-POST-MERGE-REMINDER', '#test-case/TC-PUSH-SEMVER', '#test-case/TC-PUSH-REFS', '#test-case/TC-NON-PRIMARY-NO-TAG', '#test-case/TC-NO-REMOTE']
    ownedPaths: [scripts/, src/core/, src/cli/, tests/]
    nonGoals:
      - Do not create or validate release tags on context.branch.name or any non-primary branch.
      - Do not add a version suggestion CLI command.
      - Do not force remote operations when no remote exists.
    steps:
      - Extend the managed hook installer with pre-commit planning-versus-processing branch enforcement for .yaml/.yml/.json task records.
      - Add post-merge completion reminders with exact merge/tag/push remediation commands.
      - Add pre-push checks for branch and tag ref updates, primary branch, annotated reachable SemVer baseline, 0.0.1 no-baseline fallback, aggregate impact, package.json SemVer including ahead-version human intervention, annotated tag at primary tip, and remote tag synchronization.
      - Preserve complete validation output and unmanaged hook content.
      - Add isolated Git-repository integration tests for local/remote, planning/processing, task extensions, completion, branch/tag refs, and primary/non-primary matrices.
      - Run the complete suite before commit.
