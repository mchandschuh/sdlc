        kind: requirement
        ref: WI-0024#work-item.json#requirement/WI-0024_REQ_008
        purpose: Define planning, task-processing distinction, and task-format behavior.
        required: true
      - id: WI-0024-11000000_INPUT-REQ-009
        kind: requirement
        ref: WI-0024#work-item.json#requirement/WI-0024_REQ_009
        purpose: Define completion and Git ref-update behavior.
        required: true
    objectives:
      - id: WI-0024-11000000_OBJ-001
        statement: The pre-commit hook distinguishes initial unprocessed/planned task
          materialization from task processing, identifies .yaml/.yml/.json
          task-processing changes, and blocks processing commits on mergeTarget
          or unrelated branches while allowing planning and ordinary work-item
          record updates on either allowed branch.
        inputRefs:
          - WI-0024-11000000_INPUT-REQ-002
          - WI-0024-11000000_INPUT-REQ-006
          - WI-0024-11000000_INPUT-REQ-008
        testCaseRefs:
          - "#test-case/TC-HOOK-TASK-BRANCH"
          - "#test-case/TC-HOOK-PLANNING-MATERIALIZATION"
          - "#test-case/TC-HOOK-TASK-FORMATS"
          - "#test-case/TC-HOOK-WORK-ITEM-UPDATE"
          - "#test-case/TC-HOOK-ERROR-OUTPUT"
      - id: WI-0024-11000000_OBJ-002
        statement: Post-merge and pre-push enforcement/reminders require merge
          completion, primary-branch-only annotated SemVer tags, and conditional
          remote branch/tag publication.
        inputRefs:
          - WI-0024-11000000_INPUT-REQ-004
          - WI-0024-11000000_INPUT-REQ-005
          - WI-0024-11000000_INPUT-REQ-009
        testCaseRefs:
          - "#test-case/TC-POST-MERGE-REMINDER"
          - "#test-case/TC-PUSH-SEMVER"
          - "#test-case/TC-PUSH-REFS"
          - "#test-case/TC-NON-PRIMARY-NO-TAG"
          - "#test-case/TC-NO-REMOTE"
    ownedPaths:
      - scripts/
      - src/core/
      - src/cli/
      - tests/
    nonGoals:
      - Do not create or validate release tags on context.branch.name or any
        non-primary branch.
      - Do not add a version suggestion CLI command.
      - Do not force remote operations when no remote exists.
    steps:
      - Extend the managed hook installer with pre-commit
        planning-versus-processing branch enforcement for .yaml/.yml/.json task
        records.
      - Add post-merge completion reminders with exact merge/tag/push
        remediation commands.
      - Add pre-push checks for branch and tag ref updates, primary branch,
        annotated reachable SemVer baseline, 0.0.1 no-baseline fallback,
        aggregate impact, package.json SemVer including ahead-version human
        intervention, annotated tag at primary tip, and remote tag
        synchronization.
      - Preserve complete validation output and unmanaged hook content.
      - Add isolated Git-repository integration tests for local/remote,
        planning/processing, task extensions, completion, branch/tag refs, and
        primary/non-primary matrices.
      - Run the complete suite before commit.
