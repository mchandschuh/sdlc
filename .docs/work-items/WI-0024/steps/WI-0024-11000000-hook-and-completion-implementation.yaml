    objectives:
      - id: OBJ-001
        statement: The pre-commit hook distinguishes initial unprocessed/planned task materialization from task processing, identifies .yaml/.yml/.json task-processing changes, and blocks processing commits on mergeTarget or unrelated branches while allowing planning and ordinary work-item record updates on either allowed branch.
        inputRefs: [INPUT-REQ-002, INPUT-REQ-006, INPUT-REQ-008]
        testCaseRefs: ['#test-case/TC-HOOK-TASK-BRANCH', '#test-case/TC-HOOK-PLANNING-MATERIALIZATION', '#test-case/TC-HOOK-TASK-FORMATS', '#test-case/TC-HOOK-WORK-ITEM-UPDATE', '#test-case/TC-HOOK-ERROR-OUTPUT']
      - id: OBJ-002
        statement: Post-merge and pre-push enforcement/reminders require merge completion, primary-branch-only annotated SemVer tags, and conditional remote branch/tag publication.
