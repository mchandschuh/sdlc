          - "#test-case/TC-V2-CONDITIONAL-VERSION"
          - "#test-case/TC-SEMVER-AGGREGATION"
          - "#test-case/TC-WORK-ITEM-START"
          - "#test-case/TC-TASK-FORMATS"
          - "#test-case/TC-HOOK-TASK-BRANCH"
          - "#test-case/TC-HOOK-PLANNING-MATERIALIZATION"
          - "#test-case/TC-HOOK-WORK-ITEM-UPDATE"
          - "#test-case/TC-HOOK-ERROR-OUTPUT"
          - "#test-case/TC-POST-MERGE-REMINDER"
          - "#test-case/TC-PUSH-SEMVER"
          - "#test-case/TC-PUSH-REFS"
          - "#test-case/TC-NON-PRIMARY-NO-TAG"
          - "#test-case/TC-NO-REMOTE"
        method:
          executionMode: executable
          target: sdlc work-item validate and managed Git hook branch/delivery matrix
          steps:
            - Create isolated repositories with local-only, remote, main,
              master, missing-branch, detached-HEAD, context-branch, and
              unrelated-branch states.
            - Run sdlc work-item start --work-item <id> from mergeTarget, verify
              branch creation/switch/context.branch.created commit, safe
              failure, and idempotent already-started behavior.
            - Validate ordinary work-item commits, complete initial
              planning/task generation, and staged processing changes on every
              allowed and disallowed branch.
            - Validate .yaml, .yml, and .json task envelopes and
              extension-appropriate parsing.
            - Validate work-item/v3 versionSuggestion is required in
              planned/accepted/active/implemented/complete states, while v2
              skips version-specific checks and still enforces branch/merge/push
              policy.
            - Merge completed context branches into the primary branch and
              verify reminders identify the required SemVer, annotated tag, and
              conditional push.
            - Verify only annotated, SemVer-shaped tags reachable from the
              primary branch are baselines; select the highest numeric version,
              use 0.0.1 without a baseline, reject package versions ahead of
              expectation, and aggregate multiple completed work items once by
              highest impact.
            - Verify branch and tag ref updates, tags are rejected or not
              required on non-primary branches, and no-remote repositories use
              local fallback.
            - Verify legacy v2 records produce explicit remediation rather than
              silent branch reinterpretation.
            - Run yarn typecheck, yarn build, yarn test, schema audit, and sdlc
              work-item validate --work-item WI-0024 --json.
        expected:
          outcome: passed
          exitCode: 0
        evidenceTier: cli-audit
        required: true
    nonGoals:
