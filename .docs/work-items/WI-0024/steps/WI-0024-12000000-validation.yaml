        sequence: 1
        name: validate-branch-aware-work-item-delivery
        description: Exercise local and remote branch availability, allowed current
          branches, work-item start, initial planning versus task processing
          across .yaml/.yml/.json, conditional v2/v3 versionSuggestion behavior,
          deterministic SemVer impact, merge reminders, primary-only tags,
          branch/tag ref updates, remote push checks, no-remote fallback, legacy
          v2 records, and complete repository gates.
        reason: Prove that work-item processing happens on a branch and delivery
          completes only through the primary branch with a deterministic SemVer
          tag and conditional remote publication.
        targetRefs:
          - "#intent/targets/WI-0024-12000000_TARGET-BRANCH-DELIVERY-001"
        objectiveRefs:
          - "#objective/OBJ-001"
          - "#objective/OBJ-002"
