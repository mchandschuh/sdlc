        statement: Valid graphs produce a deterministic complete topological ordering using orderKey and taskUid only as tie-breakers and without graph or linearization digests.
        inputRefs: [WI-0038-20000000_INPUT-REQ-003]
        testCaseRefs: ['#test-case/WI-0038-20000000_TC-LINEARIZATION']
    ownedPaths: [src/core/, schemas/sdlc-cli-dependency-linearization/, tests/]
    nonGoals:
      - Do not use parentTaskUid, task UID, task type, orderKey, filename, directory order, or prose as dependency edges.
      - Do not consult processingStatus or task lifecycle status while constructing the graph or full linearization.
      - Do not add readiness, leases, work-item dependencies, mutation, receipts, or graph/linearization digests.
    steps:
      - Add reusable dependency graph types and explicit dependsOn edge construction.
      - Add duplicate, missing-node, self-dependency, order-key, and cycle validation with deterministic findings.
      - Add deterministic topological sorting and complete graph-node response serialization.
      - Add valid and invalid graph fixtures, including execution-state changes that leave structural output unchanged.