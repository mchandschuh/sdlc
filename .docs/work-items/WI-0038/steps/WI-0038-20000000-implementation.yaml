      - id: WI-0038-20000000_OBJ-001
        statement: The graph builder creates edges only from explicit dependsOn and returns complete nodes with observed execution state without using that state to construct the graph.
        inputRefs: [WI-0038-20000000_INPUT-REQ-001, WI-0038-20000000_INPUT-REVIEW-001]
        testCaseRefs: ['#test-case/WI-0038-20000000_TC-EXPLICIT-EDGES']
      - id: WI-0038-20000000_OBJ-002
        statement: Invalid duplicate identifiers, duplicate order keys, missing dependencies, self-dependencies, and cycles produce stable blocking findings and no partial linearization.
        inputRefs: [WI-0038-20000000_INPUT-REQ-002]
        testCaseRefs: ['#test-case/WI-0038-20000000_TC-STRUCTURAL-FINDINGS']
