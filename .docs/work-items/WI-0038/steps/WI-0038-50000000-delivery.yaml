objective: Prepare and verify the bounded pre-1.0 minor release for Phase 2 after graph, CLI selection, response schema, schema naming, review, validation, and documentation gates pass.
references:
  required:
    - .docs/work-items/WI-0038/work-item.json
    - .docs/work-items/WI-0038/phase-2-dependency-graph-contract.md
    - .docs/work-items/WI-0038/steps/WI-0038-40000000-validation.yaml
