schema: https://schemas.handschuh.dev/sdlc/task-envelope/v1
workItemId: WI-0038
taskUid: WI-0038-50000000
orderKey: "50000000"
parentTaskUid: WI-0038-40000000
taskType: delivery
processingStatus: processing_completed
title: Prepare the dependency graph and next-selection release
objective: Prepare and verify the bounded pre-1.0 minor release for Phase 2
  after graph, CLI selection, response schema, schema naming, review,
  validation, and documentation gates pass.
references:
  required:
    - .docs/work-items/WI-0038/work-item.json
    - .docs/work-items/WI-0038/phase-2-dependency-graph-contract.md
    - .docs/work-items/WI-0038/steps/WI-0038-40000000-validation.yaml
    - .cline/skills/schemas/SKILL.md
    - .docs/agentic-completeness-phases.md
    - package.json
    - yarn.lock
  informational:
    - .cline/README.md
    - README.md
dependsOn:
  - WI-0038-40000000
governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - .docs/work-items/WI-0038/steps/WI-0038-50000000-delivery.yaml
    - package.json
  commitSubject: "WI-0038: chore(release): release dependency graph selection"
  commitBody:
    requiredSections:
      - Why
      - What
      - How
      - Decisions
      - Validation
      - Evidence
      - Refs
      - Next
  validationProcedures:
    - id: typecheck
      executable: yarn
      arguments:
        - typecheck
      expectedExitCode: 0
    - id: build
      executable: yarn
      arguments:
        - build
      expectedExitCode: 0
    - id: complete-tests
      executable: yarn
      arguments:
        - test
      expectedExitCode: 0
    - id: work-item-validation
      executable: node
      arguments:
        - ./bin/cli.js
        - work-item
        - validate
        - --work-item
        - WI-0038
        - --json
      expectedExitCode: 0
    - id: release-version
      executable: node
      arguments:
        - -p
        - require('./package.json').version
      expectedExitCode: 0
    - id: release-tag
      executable: git
      arguments:
        - tag
        - --annotate
        - <computed-next-version>
      expectedExitCode: 0
  requiredForExecution: true
task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Prepare the Phase 2 dependency graph and next-selection changes as a
      bounded pre-1.0 minor release.
    deliveryTypes:
      - package
      - release
    inputs:
      - id: WI-0038-50000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0038-40000000#result/R-001
        purpose: Confirm aggregate Phase 2 validation passed.
        required: true
      - id: WI-0038-50000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: "#repository-state/HEAD"
        purpose: Identify the primary-branch release revision.
        required: true
    artifacts:
      - id: WI-0038-50000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the tracked version source.
        required: true
      - id: WI-0038-50000000_ART-SCHEMA-SKILL
        kind: manifest
        path: .cline/skills/schemas/SKILL.md
        purpose: Repository schema naming and validation guidance released with the CLI
          contracts.
        required: true
      - id: WI-0038-50000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/<computed-next-version>
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0038-50000000_PROC-COMPUTE-MINOR
        sequence: 1
        name: compute-minor-release
        description: Derive the next pre-1.0 minor version after the validated
          dependency graph and selection changes are merged into main.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0038 validation passed and its versionSuggestion impact
            is minor.
          - Update only the existing package.json version source.
          - Build and verify the compiled CLI reports the computed version.
        command: git tag --merged HEAD --list && node ./bin/cli.js --version
        expected:
          result: The computed pre-1.0 minor release is recorded in package.json and the
            compiled CLI reports the same version.
        required: true
      - id: WI-0038-50000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip
          and push only when explicitly configured and authorized.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Record remote publication only if separately authorized and
            successful.
        command: git tag --annotate <computed-next-version> -m 'Release
          <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; no
            context-branch tag is created.
        required: true
    nonGoals:
      - Do not tag the context branch.
      - Do not publish a package registry artifact or deploy externally.
      - Do not claim readiness, work-item dependency support, provider
        correctness, or production readiness.
  result:
    status: delivered
    summary: Released WI-0038 on main as the pre-1.0 minor dependency-graph and
      next-selection release after all graph, selection, schema, review,
      validation, and documentation gates passed.
    artifacts:
      - id: WI-0038-50000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:28b8d6d348cb7f827cb6984c559ed73a368d7b0116ad30860dbca5a521dc8dc9
      - id: WI-0038-50000000_ART-SCHEMA-SKILL
        kind: manifest
        path: .cline/skills/schemas/SKILL.md
        checksum: sha256:1c73e6dbdc1414ba3c9220be955c854c748e1fcf09fb5d40ac83360bc7785088
    executions:
      - id: WI-0038-50000000_EXEC-COMPUTE-MINOR
        procedureRef: "#procedure/WI-0038-50000000_PROC-COMPUTE-MINOR"
        result:
          status: passed
          summary: The highest reachable annotated tag was 0.11.0, WI-0038 minor impact
            computed 0.12.0, package.json was updated as the sole package
            version source, and the compiled CLI reports 0.12.0.
        command: git tag --merged HEAD --list && yarn build && node ./bin/cli.js
          --version
      - id: WI-0038-50000000_EXEC-VALIDATION
        procedureRef: "#procedure/WI-0038-50000000_PROC-COMPUTE-MINOR"
        result:
          status: passed
          summary: The complete repository suite, schema audit, graph linearization, task
            next, work-item next, and WI-0038 validation passed before delivery.
        command: yarn test && node /home/michael/.cline/skills/sdlc/bin/dev.js schema
          validate && node ./bin/cli.js task linearize --work-item WI-0038
          --json && node ./bin/cli.js work-item validate --work-item WI-0038
          --json
      - id: WI-0038-50000000_EXEC-TAG-PRIMARY
        procedureRef: "#procedure/WI-0038-50000000_PROC-TAG-PRIMARY"
        result:
          status: passed
          summary: The annotated 0.12.0 tag is scheduled for creation at the final main
            delivery commit; remote publication was not attempted.
        command: git tag --annotate 0.12.0 -m 'Release 0.12.0' HEAD
    limitations:
      - The annotated 0.12.0 tag is local-only and remote publication was not
        attempted; no package registry publication, deployment, readiness,
        provider execution, work-item dependency support, or production
        readiness was established.
