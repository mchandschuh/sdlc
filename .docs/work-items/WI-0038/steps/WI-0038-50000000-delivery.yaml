  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths: [.docs/work-items/WI-0038/steps/WI-0038-50000000-delivery.yaml, package.json]
  commitSubject: 'WI-0038: chore(release): release dependency graph selection'
  commitBody:
    requiredSections: [Why, What, How, Decisions, Validation, Evidence, Refs, Next]
  validationProcedures:
    - id: typecheck
      executable: yarn
      arguments: [typecheck]
      expectedExitCode: 0
    - id: build
      executable: yarn
      arguments: [build]
      expectedExitCode: 0
    - id: complete-tests
      executable: yarn
      arguments: [test]
      expectedExitCode: 0
    - id: work-item-validation
      executable: node
      arguments: [./bin/cli.js, work-item, validate, --work-item, WI-0038, --json]
      expectedExitCode: 0
    - id: release-version
      executable: node
      arguments: [-p, "require('./package.json').version"]
      expectedExitCode: 0
    - id: release-tag
      executable: git
      arguments: [tag, --annotate, <computed-next-version>]
