schema: https://schemas.handschuh.dev/sdlc/task-envelope/v1
workItemId: WI-0031
taskUid: WI-0031-12000000
orderKey: "12000000"
parentTaskUid: WI-0031-11000000
taskType: delivery
processingStatus: processing_completed
title: Release the unified Git hook dispatcher
objective: Release the completed WI-0031 refactor from the primary branch using
  the repository's computed SemVer delivery policy without persisting a duplicate
  repository-version value.
references:
  required:
    - package.json
    - scripts/install.mjs
    - scripts/git_hooks.mjs
    - .docs/work-items/WI-0031/work-item.json
    - .docs/work-items/WI-0031/steps/WI-0031-11000000-validation.yaml
  informational:
    - .cline/README.md
dependsOn:
  - WI-0031-11000000
governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - .docs/work-items/WI-0031/steps/WI-0031-12000000-release.yaml
  commitSubject: "WI-0031: chore(release): complete version 0.7.2"
  commitBody:
    requiredSections:
      - Why
      - What
      - How
      - Decisions
      - Validation
      - Evidence
      - Refs
      - Next
  validationProcedures:
    - id: typecheck
      executable: yarn
      arguments:
        - typecheck
      expectedExitCode: 0
    - id: build
      executable: yarn
      arguments:
        - build
      expectedExitCode: 0
    - id: test
      executable: yarn
      arguments:
        - test
      expectedExitCode: 0
    - id: work-item-validation
      executable: node
      arguments:
        - ./bin/cli.js
        - work-item
        - validate
        - --work-item
        - WI-0031
        - --json
      expectedExitCode: 0
    - id: release-tag
      executable: git
      arguments:
        - tag
        - --annotate
        - 0.7.2
      expectedExitCode: 0
  requiredForExecution: true
task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Prepare the backwards-compatible 0.7.2 revision release after the
      unified documented Git hook dispatcher implementation and validation pass.
    deliveryTypes:
      - package
      - release
    inputs:
      - id: WI-0031-12000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0031-11000000#result/WI-0031-11000000_R-001
        purpose: Confirm the dispatcher implementation and behavior-preservation
          validation passed before delivery.
        required: true
      - id: WI-0031-12000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: "#repository-state/HEAD"
        purpose: Identify the primary-branch revision from which delivery is made.
        required: true
    artifacts:
      - id: WI-0031-12000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used to verify the computed release
          version; no separate repository-version file is created.
        required: true
      - id: WI-0031-12000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/0.7.2
        purpose: Annotated SemVer tag created at the primary-branch release tip.
        required: true
    procedures:
      - id: WI-0031-12000000_PROC-COMPUTE
        sequence: 1
        name: compute-primary-release
        description: Calculate the next SemVer from the highest reachable annotated
          tag and completed work-item impact, then update the existing package
          metadata without adding a currentVersion or suggestedVersion field.
        steps:
          - Read the highest reachable annotated SemVer tag.
          - Aggregate completed work-item versionSuggestion impact.
          - Calculate 0.7.2 as the next revision SemVer at execution time.
          - Set package.json to the computed release value.
          - Verify node ./bin/cli.js --version reports 0.7.2.
        command: git tag --merged HEAD --list && node ./bin/cli.js --version
        expected:
          result: The revision release is derived from tags and work-item impact,
            package.json reports 0.7.2, and no duplicate repository-version text
            is persisted.
        required: true
      - id: WI-0031-12000000_PROC-TAG
        sequence: 2
        name: tag-and-push-primary-release
        description: Create the annotated computed SemVer tag at the primary tip
          and push the primary branch and tag when a remote exists.
        steps:
          - Create the annotated computed SemVer tag at the primary tip.
          - Verify the annotated tag resolves to the primary tip.
          - Push the primary branch and tag when origin accepts the update.
        command: git tag --annotate 0.7.2 -m "Release 0.7.2" HEAD
        expected:
          result: The annotated computed SemVer tag identifies the primary release
            tip and remote publication succeeds when a remote is configured.
        required: true
    nonGoals:
      - Do not persist currentVersion, suggestedVersion, or a duplicate repository
        version in a work item, task, or standalone text file.
      - Do not create or push release tags on the context branch.
      - Do not publish a package registry artifact or deploy externally.
  result:
    status: delivered
    summary: Prepared the backwards-compatible 0.7.2 revision release, verified
      the package metadata, compiled launcher, complete gates, and WI-0031 object
      tree, and preserved the no-duplicate-version policy.
    artifacts:
      - id: WI-0031-12000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:f47b347ba0c6fa28ca8d1e162e9ad06dc0566d127931b02dff04ccfe84a16d88
    executions:
      - id: WI-0031-12000000_EXEC-RELEASE
        procedureRef: "#procedure/WI-0031-12000000_PROC-COMPUTE"
        result:
          status: passed
          summary: Baseline 0.7.1 plus WI-0031 revision impact computed 0.7.2;
            package.json and the compiled launcher report 0.7.2 after local release
            gates passed.
        command: yarn typecheck && yarn build && yarn test --run && node ./bin/cli.js work-item validate --work-item WI-0031 --json && node ./bin/cli.js --version
    limitations:
      - The annotated 0.7.2 tag and remote publication are performed only after
        this context branch is merged into the primary branch.
