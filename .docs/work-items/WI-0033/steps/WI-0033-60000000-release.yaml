  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Perform the primary-branch revision release for the validated dynamic command-module refactor.
    deliveryTypes: [package, release]
    inputs:
      - id: WI-0033-60000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0033-50000000#result/R-001
        purpose: Confirm the complete command/help/dispatch validation passed.
        required: true
      - id: WI-0033-60000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: '#repository-state/HEAD'
        purpose: Identify the primary branch release revision.
        required: true
    artifacts:
      - id: WI-0033-60000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the sole tracked package version source.
        required: true
      - id: WI-0033-60000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/<computed-next-version>
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0033-60000000_PROC-COMPUTE-REVISION
        sequence: 1
        name: compute-revision-release
        description: Derive the next revision from the highest reachable annotated SemVer tag and WI-0033 version impact.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0033 validation passed and its versionSuggestion impact is revision.
          - Update only the existing package.json version source.
          - Build and verify sdlc -v reports the computed version.
        command: git tag --merged HEAD --list && sdlc -v
        expected:
          result: The computed revision is recorded in package.json and the installed/compiled CLI reports the same version.
        required: true
      - id: WI-0033-60000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip and push when a remote exists.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Push main and the tag when the configured remote accepts the update.
        command: git tag --annotate <computed-next-version> -m 'Release <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; remote publication is recorded only when configured and successful.
        required: true
    nonGoals:
      - Do not create a release tag on the context branch.
      - Do not publish a package registry artifact or deploy externally.
      - Do not add a duplicate currentVersion or suggestedVersion source.
  result:
    status: delivered
    summary: Prepared the backwards-compatible 0.7.4 revision release on the primary branch, verified package metadata, complete gates, installed CLI behavior, and WI-0033 validation, without adding a duplicate repository-version source.
    artifacts:
      - id: WI-0033-60000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:6b5ca45f3c823bd8d3600d39bbf85260419fd3c30170000a056bec71d46fedec
    executions:
      - id: WI-0033-60000000_EXEC-COMPUTE-REVISION
        procedureRef: '#procedure/WI-0033-60000000_PROC-COMPUTE-REVISION'
        result:
          status: passed
          summary: Baseline 0.7.3 plus WI-0033 revision impact computed 0.7.4; package.json and the compiled launcher report 0.7.4 after release gates passed.
        command: git tag --merged HEAD --list && yarn typecheck && yarn build && node ./bin/cli.js --version
      - id: WI-0033-60000000_EXEC-TAG-PRIMARY
        procedureRef: '#procedure/WI-0033-60000000_PROC-TAG-PRIMARY'
        result:
          status: passed
          summary: Annotated tag 0.7.4 resolves to the primary release tip after the release commit; remote publication was not attempted.
        command: git tag --annotate 0.7.4 -m 'Release 0.7.4' HEAD
    limitations:
      - The annotated 0.7.4 tag is local-only and remote publication was not attempted; no package registry publication or deployment was performed.