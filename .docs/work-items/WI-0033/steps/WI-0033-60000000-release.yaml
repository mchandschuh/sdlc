    procedures:
      - id: WI-0033-60000000_PROC-COMPUTE-REVISION
        sequence: 1
        name: compute-revision-release
        description: Derive the next revision from the highest reachable annotated SemVer tag and WI-0033 version impact.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0033 validation passed and its versionSuggestion impact is revision.
          - Update only the existing package.json version source.
          - Build and verify sdlc -v reports the computed version.
        command: git tag --merged HEAD --list && sdlc -v
        expected:
          result: The computed revision is recorded in package.json and the installed/compiled CLI reports the same version.
        required: true
      - id: WI-0033-60000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip and push when a remote exists.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Push main and the tag when the configured remote accepts the update.
        command: git tag --annotate <computed-next-version> -m 'Release <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; remote publication is recorded only when configured and successful.
        required: true
    nonGoals:
      - Do not create a release tag on the context branch.
      - Do not publish a package registry artifact or deploy externally.
      - Do not add a duplicate currentVersion or suggestedVersion source.
