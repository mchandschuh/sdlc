schema: https://schemas.handschuh.dev/sdlc/task-envelope/v1
workItemId: WI-0032
taskUid: WI-0032-12000000
orderKey: "12000000"
parentTaskUid: WI-0032-11000000
taskType: delivery
processingStatus: processing_completed
title: Perform the next revision release after hook delivery exercise
objective: Release the completed WI-0032 exercise from the primary branch using
  the computed SemVer policy and the existing package.json version source.
references:
  required:
    - package.json
    - scripts/git_hooks.mjs
    - scripts/install.mjs
    - .docs/work-items/WI-0032/work-item.json
    - .docs/work-items/WI-0032/steps/WI-0032-11000000-validation.yaml
  informational:
    - .cline/README.md
dependsOn:
  - WI-0032-11000000
governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - package.json
    - .docs/work-items/WI-0032/steps/WI-0032-12000000-release.yaml
  commitSubject: "WI-0032: chore(release): complete computed revision"
  commitBody:
    requiredSections: [Why, What, How, Decisions, Validation, Evidence, Refs, Next]
  validationProcedures:
    - id: typecheck
      executable: yarn
      arguments: [typecheck]
      expectedExitCode: 0
    - id: build
      executable: yarn
      arguments: [build]
      expectedExitCode: 0
    - id: test
      executable: yarn
      arguments: [test]
      expectedExitCode: 0
    - id: work-item-validation
      executable: node
      arguments: [./bin/cli.js, work-item, validate, --work-item, WI-0032, --json]
      expectedExitCode: 0
    - id: release-tag
      executable: git
      arguments: [tag, --annotate, 0.7.3]
      expectedExitCode: 0
  requiredForExecution: true
task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Prepare the backwards-compatible 0.7.3 revision release after the
      installed hook and branch-operation exercise passes.
    deliveryTypes: [package, release]
    inputs:
      - id: WI-0032-12000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0032-11000000#result/WI-0032-11000000_R-001
        purpose: Confirm the installed hook and branch-operation validation passed.
        required: true
      - id: WI-0032-12000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: "#repository-state/HEAD"
        purpose: Identify the primary-branch revision from which delivery is made.
        required: true
    artifacts:
      - id: WI-0032-12000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the sole tracked package version source.
        required: true
      - id: WI-0032-12000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/0.7.3
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0032-12000000_PROC-COMPUTE
        sequence: 1
        name: compute-revision-release
        description: Derive 0.7.3 from the highest reachable annotated SemVer tag
          and WI-0032 versionSuggestion impact, then update package.json.
        steps:
          - Read the highest reachable annotated SemVer tag on the primary history.
          - Aggregate the completed WI-0032 revision impact.
          - Calculate 0.7.3 as the next revision SemVer at execution time.
          - Update only the existing package.json version source.
          - Verify the compiled launcher reports 0.7.3.
        command: git tag --merged HEAD --list && node ./bin/cli.js --version
        expected:
          result: The revision is calculated from repository tags and work-item
            impact, package.json reports 0.7.3, and no duplicate current or suggested
            version is persisted.
        required: true
      - id: WI-0032-12000000_PROC-TAG
        sequence: 2
        name: tag-and-push-primary-release
        description: Create the annotated computed SemVer tag at the primary tip
          and push the primary branch and tag when a remote exists.
        steps:
          - Create the annotated computed SemVer tag at the primary tip.
          - Verify the annotated tag resolves to the primary tip.
          - Push main and the tag when origin accepts the update.
        command: git tag --annotate 0.7.3 -m "Release 0.7.3" HEAD
        expected:
          result: The annotated computed tag identifies the primary release tip and
            remote publication succeeds when a remote is configured.
        required: true
    nonGoals:
      - Do not persist currentVersion, suggestedVersion, or a duplicate repository version.
      - Do not create or push a release tag on the context branch.
      - Do not publish a package registry artifact or deploy externally.
  result:
    status: delivered
    summary: Prepared the backwards-compatible 0.7.3 revision release, verified
      package metadata, complete gates, and WI-0032 validation, without adding a
      duplicate repository-version source.
    artifacts:
      - id: WI-0032-12000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:d8bae9882726ffbacb8e37ce2ccf7c10bd727e82fcefc26b6959a75f5561b7e4
    executions:
      - id: WI-0032-12000000_EXEC-RELEASE
        procedureRef: "#procedure/WI-0032-12000000_PROC-COMPUTE"
        result:
          status: passed
          summary: Baseline 0.7.2 plus WI-0032 revision impact computed 0.7.3;
            package.json and the compiled launcher report 0.7.3 after release gates passed.
        command: yarn typecheck && yarn build && HOME=$(mktemp -d) yarn test --run && node ./bin/cli.js work-item validate --work-item WI-0032 --json && node ./bin/cli.js --version
    limitations:
      - Tagging and remote publication occur only after the context branch is merged into main.