governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - .docs/work-items/WI-0037/steps/WI-0037-10000000-implementation.yaml
    - schemas/
    - src/core/work-item-validation.ts
    - tests/
  commitSubject: "WI-0037: feat(schema): enforce lifecycle transition invariants"
  commitBody:
    requiredSections:
      - Why
      - What
      - How
      - Decisions
      - Validation
      - Evidence
      - Refs
      - Next
  validationProcedures:
