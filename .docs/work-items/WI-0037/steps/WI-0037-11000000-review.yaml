schema: https://schemas.handschuh.dev/sdlc/task-envelope/v1
workItemId: WI-0037
taskUid: WI-0037-11000000
orderKey: '11000000'
parentTaskUid: WI-0037-10000000
taskType: review
processingStatus: unprocessed
title: Review lifecycle transition and result-policy implementation
objective: Independently review the Phase 1 lifecycle metadata, transition graph, result-field allowlists, generic validation behavior, and separation of lifecycle facts.
references:
  required:
    - .docs/work-items/WI-0037/work-item.json
    - .docs/work-items/WI-0037/phase-1-lifecycle-contract.md
    - .docs/work-items/WI-0037/steps/WI-0037-10000000-implementation.yaml
    - schemas/README.md
    - schemas/sdlc-task-envelope/v1/sdlc-task-envelope.schema.json
    - schemas/sdlc-task-implementation/v1/sdlc-task-implementation.schema.json
    - schemas/sdlc-task-validation/v1/sdlc-task-validation.schema.json
    - schemas/sdlc-task-review/v1/sdlc-task-review.schema.json
    - src/core/work-item-validation.ts
    - tests/cli.test.ts
  informational:
    - .cline/README.md
    - README.md
dependsOn: [WI-0037-10000000]
governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths: [.docs/work-items/WI-0037/steps/WI-0037-11000000-review.yaml]
  commitSubject: 'WI-0037: review(schema): inspect lifecycle invariants'
  commitBody:
    requiredSections: [Why, What, How, Decisions, Validation, Evidence, Refs, Next]
  validationProcedures:
    - id: lifecycle-review-tests
      executable: yarn
      arguments: [test, tests/cli.test.ts, --run]
      expectedExitCode: 0
  requiredForExecution: true
task:
  status: planned
  taskSchema: https://schemas.handschuh.dev/sdlc/task-review/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-review/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-review/v1#/properties/result
  intent:
    summary: Review the exact lifecycle metadata and generic validator implementation against the finalized Phase 1 contract.
    reviewKind: code
    target:
      taskType: implementation
      taskRef: WI-0037-10000000
      result: {ref: WI-0037-10000000#result/R-001, sha256: null}
    gateId: implementation-result
    policyRef: {ref: repository-local-review-policy, sha256: null}
    criteria:
      - id: CRIT-001
        statement: All ten task schemas declare metadata whose status vocabulary, categories, initial status, and transition graph match the Phase 1 contract.
        purpose: Prevent inconsistent task-specific lifecycle state machines.
        required: true
        evidenceRefs: [WI-0037-10000000#result/R-001]
      - id: CRIT-002
        statement: Planned forbids result fields, active/blocked/deferred permit partial retention, and milestone/complete statuses enforce the declared result allowlist and required paths.
        purpose: Prevent premature or incomplete result records.
        required: true
        evidenceRefs: [WI-0037-10000000#result/R-001]
      - id: CRIT-003
        statement: Generic validation preserves independent processingStatus, task lifecycle status, result status, review decision, validation outcome, and work-item status values.
        purpose: Prevent lifecycle or approval inference from unrelated fields.
        required: true
        evidenceRefs: [WI-0037-10000000#result/R-001]
      - id: CRIT-004
        statement: The implementation does not claim direct-edit prevention, readiness, traceability, receipts, merge authority, or derived completion.
        purpose: Verify the Phase 1 boundary remains compatible with later phases.
        required: true
        evidenceRefs: [WI-0037-10000000#result/R-001]
    evidenceRequirements:
      - id: EVID-001
        kind: target-result
        ref: WI-0037-10000000#result/R-001
        purpose: Inspect the implementation result and exact changed paths.
        required: true
        minimumTier: inspection
    nonGoals:
      - id: NON-001
        statement: This review does not approve deployment, remote publication, or production readiness.
      - id: NON-002
        statement: This review does not mutate task or work-item lifecycle state.
    context:
      - id: CTX-001
        kind: contract
        ref: .docs/work-items/WI-0037/phase-1-lifecycle-contract.md
        purpose: Apply the finalized lifecycle and result-policy decisions.
        required: true
      - id: CTX-002
        kind: contract
        ref: .docs/work-items/WI-0034/task-lifecycle-status-contract.md
        purpose: Preserve the existing task-specific status/result/processing separation.
        required: true