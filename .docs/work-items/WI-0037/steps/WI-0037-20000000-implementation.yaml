schema: https://schemas.handschuh.dev/sdlc/task-envelope/v1
workItemId: WI-0037
taskUid: WI-0037-20000000
orderKey: "20000000"
parentTaskUid: WI-0037-11000000
taskType: implementation
processingStatus: processing_completed
title: Audit persisted lifecycle records and add complete matrix coverage
objective: Audit every persisted task envelope and fixture against its selected
  type-specific lifecycle contract, add all-task-type transition and
  result-policy matrix coverage, and correct only records or examples that
  violate the finalized Phase 1 policy.
references:
  required:
    - .docs/work-items/WI-0037/work-item.json
    - .docs/work-items/WI-0037/phase-1-lifecycle-contract.md
    - .docs/work-items/WI-0037/steps/WI-0037-10000000-implementation.yaml
    - .docs/work-items/WI-0037/steps/WI-0037-11000000-review.yaml
    - .docs/work-items/WI-0034/task-lifecycle-status-contract.md
    - schemas/README.md
    - schemas/sdlc-task-envelope/v1/sdlc-task-envelope.schema.json
    - src/core/work-item-validation.ts
    - tests/cli.test.ts
    - .docs/work-items/
  informational:
    - .cline/README.md
    - README.md
dependsOn:
  - WI-0037-11000000
governance:
  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - .docs/work-items/WI-0037/steps/WI-0037-20000000-implementation.yaml
    - .docs/work-items/
    - tests/
  commitSubject: "WI-0037: test(schema): audit lifecycle records and matrix"
  commitBody:
    requiredSections:
      - Why
      - What
      - How
      - Decisions
      - Validation
      - Evidence
      - Refs
      - Next
  validationProcedures:
    - id: typecheck
      executable: yarn
      arguments:
        - typecheck
      expectedExitCode: 0
    - id: build
      executable: yarn
      arguments:
        - build
      expectedExitCode: 0
    - id: lifecycle-matrix-tests
      executable: yarn
      arguments:
        - test
        - tests/cli.test.ts
        - --run
      expectedExitCode: 0
  requiredForExecution: true
task:
  status: implemented
  taskSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/result
  intent:
    summary: Audit persisted task records and fixtures against the finalized
      lifecycle graph and result-field policy, with explicit all-task-type
      matrix coverage.
    changeTypes:
      - test-code
      - documentation
      - configuration
    changeIntent: refactor
    inputs:
      - id: WI-0037-20000000_INPUT-REQ-001
        kind: requirement
        ref: WI-0037#work-item.json#requirement/WI-0037_REQ_005
        purpose: Define persisted-record and lifecycle matrix coverage.
        required: true
      - id: WI-0037-20000000_INPUT-REQ-002
        kind: requirement
        ref: WI-0037#work-item.json#requirement/WI-0037_REQ_004
        purpose: Define independent lifecycle-fact assertions.
        required: true
      - id: WI-0037-20000000_INPUT-REVIEW-001
        kind: task
        ref: WI-0037-11000000#result/R-001
        purpose: Provide the independent review gate for the lifecycle implementation.
        required: true
    objectives:
      - id: WI-0037-20000000_OBJ-001
        statement: Every persisted task envelope and representative fixture matches the
          selected task schema status enum and lifecycle metadata without
          speculative result-status rewrites.
        inputRefs:
          - WI-0037-20000000_INPUT-REQ-001
          - WI-0037-20000000_INPUT-REVIEW-001
        testCaseRefs:
          - "#test-case/WI-0037-20000000_TC-PERSISTED-AUDIT"
      - id: WI-0037-20000000_OBJ-002
        statement: Matrix tests cover all ten task types, common transitions,
          task-specific milestone paths, result allowlists, required and
          forbidden paths, terminal closure, superseded reopening, and status
          independence.
        inputRefs:
          - WI-0037-20000000_INPUT-REQ-001
          - WI-0037-20000000_INPUT-REQ-002
        testCaseRefs:
          - "#test-case/WI-0037-20000000_TC-LIFECYCLE-MATRIX"
          - "#test-case/WI-0037-20000000_TC-STATUS-INDEPENDENCE"
    ownedPaths:
      - .docs/work-items/
      - tests/
    nonGoals:
      - Do not rewrite historical result.status values merely to make task
        lifecycle status pass.
      - Do not add task mutation APIs, receipts, readiness, traceability, merge
        enforcement, or completion derivation.
      - Do not claim that field presence proves execution, correctness, review,
        provider behavior, or production readiness.
    steps:
      - Enumerate every persisted task envelope and resolve its selected task
        schema and lifecycle metadata.
      - Correct only confirmed lifecycle-policy violations and preserve valid
        historical records byte-for-byte where no correction is required.
      - Add dynamic persisted-record status audit and all-ten-task-type
        lifecycle matrix tests.
      - Add explicit assertions for processingStatus, task status, result
        status, review decision, validation outcome, and work-item status
        independence.
  result:
    status: implemented
    implementation:
      summary: Audited all persisted task envelopes, removed two confirmed premature
        planned-result records, and added all-task-type lifecycle matrix and
        status-independence coverage.
      changes:
        - id: WI-0037-20000000_CHANGE-001
          type: test-code
          summary: Added dynamic persisted-record and ten-task-type lifecycle matrix
            assertions for metadata, transitions, result presence, allowlists,
            required paths, forbidden paths, terminal closure, superseded
            recovery, and independent lifecycle facts.
          objectiveRefs:
            - WI-0037-20000000_OBJ-001
            - WI-0037-20000000_OBJ-002
          paths:
            - tests/cli.test.ts
        - id: WI-0037-20000000_CHANGE-002
          type: documentation
          summary: Preserved the audit boundary by recording only confirmed planned-result
            corrections and leaving valid historical result.status values
            unchanged.
          objectiveRefs:
            - WI-0037-20000000_OBJ-001
          paths:
            - .docs/work-items/WI-0013/steps/WI-0013-10000000-implementation.yaml
            - .docs/work-items/WI-0013/steps/WI-0013-20000000-validation.yaml
      testImplementations:
        - testCaseRef: "#test-case/WI-0037-20000000_TC-PERSISTED-AUDIT"
          path: tests/cli.test.ts
          selector: audits every persisted task status and rejects planned task results
        - testCaseRef: "#test-case/WI-0037-20000000_TC-LIFECYCLE-MATRIX"
          path: tests/cli.test.ts
          selector: covers lifecycle matrix edges for every supported task type
        - testCaseRef: "#test-case/WI-0037-20000000_TC-STATUS-INDEPENDENCE"
          path: tests/cli.test.ts
          selector: preserves independent processing, lifecycle, outcome, review,
            validation, and work-item statuses
    verification:
      status: passed
      objectiveRefs:
        - WI-0037-20000000_OBJ-001
        - WI-0037-20000000_OBJ-002
      tests:
        - id: WI-0037-20000000_EXEC-001
          type: cli-audit
          testCaseRefs:
            - "#test-case/WI-0037-20000000_TC-PERSISTED-AUDIT"
            - "#test-case/WI-0037-20000000_TC-LIFECYCLE-MATRIX"
            - "#test-case/WI-0037-20000000_TC-STATUS-INDEPENDENCE"
          command: yarn typecheck && yarn build && yarn test tests/cli.test.ts --run
          status: passed
          result: Typecheck, build, and all 102 focused CLI tests passed; the persisted
            audit covered 132 task envelopes with no planned populated results,
            the schema audit passed, and WI-0037 validation passed.
    limitations:
      - The audit does not prove that historical result claims are true or that
        processing, review, validation, provider, deployment, or production
        events occurred.
      - Mutation commands, receipts, readiness, traceability, merge enforcement,
        and derived completion remain outside Phase 1.
