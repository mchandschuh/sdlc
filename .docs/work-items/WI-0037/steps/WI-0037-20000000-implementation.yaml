task:
  status: planned
  taskSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/result
  intent:
    summary: Audit persisted task records and fixtures against the finalized lifecycle graph and result-field policy, with explicit all-task-type matrix coverage.
    changeTypes: [test-code, documentation, configuration]
    changeIntent: refactor
    inputs:
      - id: WI-0037-20000000_INPUT-REQ-001
        kind: requirement
        ref: WI-0037#work-item.json#requirement/WI-0037_REQ_005
        purpose: Define persisted-record and lifecycle matrix coverage.
        required: true
      - id: WI-0037-20000000_INPUT-REQ-002
        kind: requirement
        ref: WI-0037#work-item.json#requirement/WI-0037_REQ_004
        purpose: Define independent lifecycle-fact assertions.
        required: true
      - id: WI-0037-20000000_INPUT-REVIEW-001
        kind: task
        ref: WI-0037-11000000#result/R-001
        purpose: Provide the independent review gate for the lifecycle implementation.
        required: true
    objectives:
      - id: WI-0037-20000000_OBJ-001
        statement: Every persisted task envelope and representative fixture matches the selected task schema status enum and lifecycle metadata without speculative result-status rewrites.
        inputRefs: [WI-0037-20000000_INPUT-REQ-001, WI-0037-20000000_INPUT-REVIEW-001]
        testCaseRefs: ['#test-case/WI-0037-20000000_TC-PERSISTED-AUDIT']
      - id: WI-0037-20000000_OBJ-002
        statement: Matrix tests cover all ten task types, common transitions, task-specific milestone paths, result allowlists, required and forbidden paths, terminal closure, superseded reopening, and status independence.
        inputRefs: [WI-0037-20000000_INPUT-REQ-001, WI-0037-20000000_INPUT-REQ-002]
        testCaseRefs: ['#test-case/WI-0037-20000000_TC-LIFECYCLE-MATRIX', '#test-case/WI-0037-20000000_TC-STATUS-INDEPENDENCE']
    ownedPaths: [.docs/work-items/, tests/]
    nonGoals:
      - Do not rewrite historical result.status values merely to make task lifecycle status pass.
      - Do not add task mutation APIs, receipts, readiness, traceability, merge enforcement, or completion derivation.
      - Do not claim that field presence proves execution, correctness, review, provider behavior, or production readiness.
    steps:
      - Enumerate every persisted task envelope and resolve its selected task schema and lifecycle metadata.
      - Correct only confirmed lifecycle-policy violations and preserve valid historical records byte-for-byte where no correction is required.
      - Add dynamic persisted-record status audit and all-ten-task-type lifecycle matrix tests.
      - Add explicit assertions for processingStatus, task status, result status, review decision, validation outcome, and work-item status independence.