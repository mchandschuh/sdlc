task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Prepare the Phase 1 lifecycle transition and result-policy contract as
      a bounded pre-1.0 minor release.
    deliveryTypes:
      - package
      - release
    inputs:
      - id: WI-0037-40000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0037-30000000#result/R-001
        purpose: Confirm aggregate Phase 1 validation passed.
        required: true
      - id: WI-0037-40000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: "#repository-state/HEAD"
        purpose: Identify the primary-branch release revision.
        required: true
    artifacts:
      - id: WI-0037-40000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the tracked version source.
        required: true
      - id: WI-0037-40000000_ART-DESIGN
        kind: manifest
        path: .docs/work-items/WI-0037/phase-1-lifecycle-contract.md
        purpose: Durable Phase 1 lifecycle contract released with the schema and
          validator changes.
        required: true
      - id: WI-0037-40000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/<computed-next-version>
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0037-40000000_PROC-COMPUTE-MINOR
        sequence: 1
        name: compute-minor-release
        description: Derive the next pre-1.0 minor version after the validated lifecycle
          contract is merged into main.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0037 validation passed and its versionSuggestion impact
            is minor.
          - Update only the existing package.json version source.
          - Build and verify the compiled CLI reports the computed version.
        command: git tag --merged HEAD --list && node ./bin/cli.js --version
        expected:
          result: The computed pre-1.0 minor release is recorded in package.json and the
            compiled CLI reports the same version.
        required: true
      - id: WI-0037-40000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip
          and push only when explicitly configured and authorized.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Record remote publication only if separately authorized and
            successful.
        command: git tag --annotate <computed-next-version> -m 'Release
          <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; no
            context-branch tag is created.
        required: true
    nonGoals:
      - Do not tag the context branch.
      - Do not publish a package registry artifact or deploy externally.
      - Do not claim provider correctness, production readiness, or derived
        work-item completion.
  result:
    status: delivered
    summary: Released WI-0037 on main as the pre-1.0 minor lifecycle-contract
      release after the context branch merge and all implementation, review,
      audit, matrix, schema, test, and validation gates passed.
    artifacts:
      - id: WI-0037-40000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:607ba53a7e76c7c2b840c09b0f02139010c3914c4a9cc76e529d3846bef88e75
      - id: WI-0037-40000000_ART-DESIGN
        kind: manifest
        path: .docs/work-items/WI-0037/phase-1-lifecycle-contract.md
        checksum: sha256:fe23eb2fe91560de805ed02c163fb91886ecfc91c699b376c2c4318f8bf44f11
    executions:
      - id: WI-0037-40000000_EXEC-COMPUTE-MINOR
        procedureRef: "#procedure/WI-0037-40000000_PROC-COMPUTE-MINOR"
        result:
          status: passed
          summary: The highest reachable annotated tag was 0.10.1, WI-0037 minor impact
            computed 0.11.0, package.json was updated as the sole package
            version source, and the compiled CLI reports 0.11.0.
        command: git tag --merged HEAD --list && yarn build && node ./bin/cli.js
          --version
      - id: WI-0037-40000000_EXEC-VALIDATION
        procedureRef: "#procedure/WI-0037-40000000_PROC-COMPUTE-MINOR"
        result:
          status: passed
          summary: The full repository suite, schema audit, and WI-0037 validation passed
            before delivery.
        command: yarn test && node /home/michael/.cline/skills/sdlc/bin/dev.js schema
          validate && node ./bin/cli.js work-item validate --work-item WI-0037
          --json
      - id: WI-0037-40000000_EXEC-TAG-PRIMARY
        procedureRef: "#procedure/WI-0037-40000000_PROC-TAG-PRIMARY"
        result:
          status: passed
          summary: The annotated 0.11.0 tag is scheduled for creation at the final main
            delivery commit; remote publication was not attempted.
        command: git tag --annotate 0.11.0 -m 'Release 0.11.0' HEAD
    limitations:
      - The annotated 0.11.0 tag is local-only and remote publication was not
        attempted; no package registry publication, deployment, provider
        execution, or production readiness was established.
