title: Release Git repository-root resolution
objective: Prepare and verify the next bounded primary-branch release after Git-root replacement, schema-registry separation, multi-repository validation, review, and package gates pass.
references:
  required:
    - .docs/work-items/WI-0035/work-item.json
    - .docs/work-items/WI-0035/repository-root-resolution-pattern.md
    - .docs/work-items/WI-0035/steps/WI-0035-20000000-validation.yaml
    - package.json
