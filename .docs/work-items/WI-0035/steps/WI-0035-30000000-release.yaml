task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-delivery/v1#/properties/result
  intent:
    summary: Prepare the Git repository-root replacement as the next bounded primary-branch release.
    deliveryTypes: [package, release]
    inputs:
      - id: WI-0035-30000000_INPUT-VALIDATION-001
        kind: validation
        ref: WI-0035-20000000#result/R-001
        purpose: Confirm complete Git-root, schema-registry, package, command, and multi-repository validation passed.
        required: true
      - id: WI-0035-30000000_INPUT-REPOSITORY-001
        kind: repositoryState
        ref: '#repository-state/HEAD'
        purpose: Identify the primary branch release revision.
        required: true
    artifacts:
      - id: WI-0035-30000000_ART-MANIFEST
        kind: manifest
        path: package.json
        purpose: Existing package metadata used as the sole tracked package version source.
        required: true
      - id: WI-0035-30000000_ART-TAG
        kind: releaseRecord
        path: .git/refs/tags/<computed-next-version>
        purpose: Annotated SemVer tag created at the primary release tip.
        required: true
    procedures:
      - id: WI-0035-30000000_PROC-COMPUTE-REVISION
        sequence: 1
        name: compute-revision-release
        description: Derive the next revision from the highest reachable annotated SemVer tag and WI-0035 revision impact.
        steps:
          - Verify the context branch has been merged into main.
          - Read the highest reachable annotated SemVer tag.
          - Confirm WI-0035 validation passed and its versionSuggestion impact is minor.
          - Update only the existing package.json version source.
          - Build and verify the compiled CLI reports the computed version.
        command: git tag --merged HEAD --list && node ./bin/cli.js --version
        expected:
          result: The computed release is recorded in package.json and the installed/compiled CLI reports the same version without adding a duplicate repository-version source.
        required: true
      - id: WI-0035-30000000_PROC-TAG-PRIMARY
        sequence: 2
        name: tag-primary-release
        description: Create the annotated computed SemVer tag at the primary branch tip and push when a remote exists.
        steps:
          - Create the annotated computed tag on main.
          - Verify the tag resolves to the primary release tip.
          - Push main and the tag when the configured remote accepts the update.
        command: git tag --annotate <computed-next-version> -m 'Release <computed-next-version>' HEAD
        expected:
          result: The primary branch contains the annotated computed release tag; remote publication is recorded only when configured and successful.
        required: true
    nonGoals:
      - Do not tag the context branch.
      - Do not publish a package registry artifact or deploy externally.
      - Do not claim consumer migration or production readiness.
  result:
    status: delivered
    summary: Prepared the backwards-compatible 0.8.0 minor release for Git-based repository-root resolution on the primary branch, verified package metadata, complete gates, installed schema-registry behavior, and WI-0035 validation without adding a duplicate repository-version source.
    artifacts:
      - id: WI-0035-30000000_ART-MANIFEST
        kind: manifest
        path: package.json
        checksum: sha256:2f87fbf7f2a819dd5866fe49c6f47680284bf8c27c8c11abeb5a922c218f1bae
    executions:
      - id: WI-0035-30000000_EXEC-COMPUTE-REVISION
        procedureRef: '#procedure/WI-0035-30000000_PROC-COMPUTE-REVISION'
        result:
          status: passed
          summary: Baseline 0.7.4 plus WI-0035 minor impact computed 0.8.0; package.json and the compiled launcher report 0.8.0 after release gates passed.
        command: git tag --merged HEAD --list && yarn typecheck && yarn build && node ./bin/cli.js --version
      - id: WI-0035-30000000_EXEC-TAG-PRIMARY
        procedureRef: '#procedure/WI-0035-30000000_PROC-TAG-PRIMARY'
        result:
          status: passed
          summary: Annotated tag 0.8.0 resolves to the primary release tip after the release commit; remote publication was not attempted.
        command: git tag --annotate 0.8.0 -m 'Release 0.8.0' HEAD
    limitations:
      - The annotated 0.8.0 tag is local-only and remote publication was not attempted; no consumer migration, package registry publication, or deployment was performed.