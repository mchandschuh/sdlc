    ownedPaths: [src/core/, src/cli/, scripts/install.mjs, tests/, schemas/sdlc-config/]
    nonGoals:
      - Do not change command business semantics or JSON response schemas.
      - Do not make repositoryRoot select schemas or invoke schema-validate.
      - Do not introduce ambiguous automatic selection among named repositories.
    steps:
      - Add the reusable Git repository-root resolver and stable error/context contract.
      - Replace commandContext repository-root fallback with Git resolution and preserve schemaRegistryRoot as a separate installed registry path.
      - Route repository-dependent command/core operations and hooks through the shared component.
      - Remove or migrate repositoryRoot config/installer behavior that creates a stale singleton fallback.
      - Add isolated multi-repository, worktree, non-repository, schema-registry, and command-consumer tests.
