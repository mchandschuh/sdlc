        required: true
    objectives:
      - id: WI-0035-10000000_OBJ-001
        statement: A reusable Git-backed component resolves and reports the nearest repository root for nested paths, files, worktrees, and explicit starting paths.
        inputRefs: [WI-0035-10000000_INPUT-REQ-001, WI-0035-10000000_INPUT-REQ-002]
        testCaseRefs: ['#test-case/TC-GIT-ROOT', '#test-case/TC-GIT-WORKTREE']
      - id: WI-0035-10000000_OBJ-002
        statement: Repository-dependent commands, validation, references, migrations, branch checks, and hooks use the shared resolver without stale configured-root fallback.
        inputRefs: [WI-0035-10000000_INPUT-REQ-002, WI-0035-10000000_INPUT-REQ-004]
        testCaseRefs: ['#test-case/TC-MULTI-REPOSITORY', '#test-case/TC-NON-REPOSITORY', '#test-case/TC-COMMAND-CONSUMERS']
      - id: WI-0035-10000000_OBJ-003
        statement: schema-validate and reference-schema matching use the installed schema registry independently from repositoryRoot.
        inputRefs: [WI-0035-10000000_INPUT-REQ-003]
        testCaseRefs: ['#test-case/TC-SCHEMA-REGISTRY-SEPARATION', '#test-case/TC-EXTERNAL-REPOSITORY']
    ownedPaths: [src/core/, src/cli/, scripts/install.mjs, tests/, schemas/sdlc-config/]
    nonGoals:
      - Do not change command business semantics or JSON response schemas.
      - Do not make repositoryRoot select schemas or invoke schema-validate.
      - Do not introduce ambiguous automatic selection among named repositories.
    steps:
      - Add the reusable Git repository-root resolver and stable error/context contract.
      - Replace commandContext repository-root fallback with Git resolution and preserve schemaRegistryRoot as a separate installed registry path.
      - Route repository-dependent command/core operations and hooks through the shared component.
      - Remove or migrate repositoryRoot config/installer behavior that creates a stale singleton fallback.
      - Add isolated multi-repository, worktree, non-repository, schema-registry, and command-consumer tests.
