          selector: lists work items from the repository in deterministic order
        - testCaseRef: '#test-case/TC-TASK-LIST'
          path: tests/cli.test.ts
          selector: lists selected work-item tasks from its declared steps path
        - testCaseRef: '#test-case/TC-DISCOVERY-ERRORS'
