      - Do not execute or mutate discovered work items or tasks.
      - Do not add HTTP, container, credential, persistence, or deployment behavior.
    steps:
      - Add reusable filesystem discovery services for work-item.json records and task envelopes under stepsPath.
      - Add work-item and nested task command routing with stable human-readable and machine-readable output boundaries.
      - Add focused tests for ordering, successful discovery, invalid records, unknown IDs, and read-only behavior.
