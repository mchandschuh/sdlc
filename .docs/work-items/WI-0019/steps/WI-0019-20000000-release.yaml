title: Release 0.4.0 and tag master
objective: Bump the package minor version to 0.4.0, verify the compiled CLI, and create annotated tag 0.4.0 on master at the final release commit.
references:
  required:
    - package.json
    - bin/cli.js
    - src/cli/main.ts
    - .docs/work-items/WI-0019/work-item.json
    - .docs/work-items/WI-0019/steps/WI-0019-11000000-work-item-migration-validation.yaml
  informational:
    - tsconfig.json
